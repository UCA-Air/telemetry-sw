; UCA&Air — Nodo de vuelo v1 (ESP32-C3 SuperMini + DX-LR02 433 MHz + OLED 0,66")
;
;   pio run -t upload        grabar
;   pio device monitor       ver los mensajes por USB (115200)

[env:nodo]
platform = espressif32@6.9.0
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1      ; la SuperMini usa el USB nativo del C3
    -DARDUINO_USB_MODE=1
    -DHOME_LAT=36.53190              ; centro del vuelo inventado: poned vuestro campo
    -DHOME_LON=-6.19870
lib_deps =
    olikraus/U8g2@^2.36.2
